# Render Blueprint: https://render.com/docs/blueprint-spec
# Backend only. The Streamlit front end is hosted on Streamlit Community Cloud and reaches
# this API through its API_URL secret (https://churn-early-warning-api.onrender.com).
# The model is trained inside the Docker build, so every deploy ships a fresh model.
services:
  - type: web
    name: churn-early-warning-api
    runtime: docker
    plan: free            # sleeps after ~15 min idle; first request then takes ~30-60 s
    region: frankfurt     # closest Render region to East Africa
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass   # deploy on push to main only after GitHub CI passes
